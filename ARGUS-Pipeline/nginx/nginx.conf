# TLS termination for ARGUS. The API is not published on the host: this is the only way in.
# Serves the built frontend (ARGUS-Frontend/dist) and proxies /api, /health and the API docs to the api container.
worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    keepalive_timeout 65;

    # Uploads: match the API's MAX_REQUEST_BYTES (100 MB). Voice/biometric calls run CPU inference, so allow slow replies.
    client_max_body_size 100m;
    proxy_read_timeout   180s;
    proxy_send_timeout   180s;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    # Docker's embedded DNS. With a literal `proxy_pass http://api:8000` nginx resolves the name ONCE at startup, so
    # recreating the api container (a rebuild or redeploy) leaves nginx sending traffic to the old address: every request
    # is a 502 until nginx is restarted. Proxying to a variable makes nginx re-resolve at this interval instead.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache   shared:TLS:10m;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "no-referrer" always;
        # OpenStreetMap tiles are the only third-party resource (Geographic Risk map). Point the map at an internal tile
        # server and drop that host from img-src for an air-gapped deployment.
        add_header Content-Security-Policy   "default-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'" always;

        set $api_upstream http://api:8000;

        location ~ ^/(api/|health$|docs|redoc|openapi\.json$) {
            proxy_pass         $api_upstream;   # variable, no URI part: the request URI is forwarded unchanged
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
        }

        location / {
            root  /usr/share/nginx/html;
            index index.html;
            try_files $uri /index.html;   # single-page app: client-side routes fall back to index.html
        }
    }
}
