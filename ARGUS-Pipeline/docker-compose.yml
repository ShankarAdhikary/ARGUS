# ARGUS stack.
#   * nginx is the only service published on the host (80 -> 443 redirect, 443 TLS). The API is internal.
#   * Secrets live in Vault. A Vault agent sidecar renders them to files on a tmpfs volume that the API, worker and
#     datastores read; .env only needs the Vault unseal key (and non-secret settings).
#   * Neo4j browser (7474) and the MinIO console (9001) are NOT published. For local debugging only, add
#     `-f docker-compose.debug.yml`; that override marks the stack so ARGUS_ENV=production refuses to start.

services:
  # ------------------------------------------------------------------ edge
  nginx:
    image: nginx:1.27
    restart: unless-stopped
    environment:
      ARGUS_ENV: ${ARGUS_ENV:-development}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/10-dev-cert.sh:/docker-entrypoint.d/10-dev-cert.sh:ro
      # Development: a self-signed pair is generated here on first start. Production: point TLS_CERT_DIR at the real
      # tls.crt / tls.key (the entrypoint refuses to generate a certificate when ARGUS_ENV=production).
      - ${TLS_CERT_DIR:-./nginx/certs}:/etc/nginx/certs
      # Built frontend: `cd ARGUS-Frontend && npm run build`
      - ../ARGUS-Frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy

  # ------------------------------------------------------------------ application
  api:
    build:
      context: .
      secrets:
        - hf_token
      args:
        INSTALL_INDIC_NER: ${INSTALL_INDIC_NER:-true}
        INSTALL_VOICE: ${INSTALL_VOICE:-true}
        INSTALL_VOICEPRINT: ${INSTALL_VOICEPRINT:-true}
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2 --timeout-keep-alive 65
    restart: unless-stopped
    environment:
      MINIO_ENDPOINT: minio:9000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_USER: elastic
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-argus_db}
      # JWT_SECRET, MFA_ENCRYPTION_KEY, VICTIM_HASH_PEPPER, the LLM API keys and every datastore password are read
      # from /vault/secrets/* (rendered by vault-agent); none of them is set here.
      SECRETS_DIR: /vault/secrets
      ENABLE_INDIC_NER: ${ENABLE_INDIC_NER:-true}
      ENABLE_VOICE: ${ENABLE_VOICE:-true}
      # Fingerprint engine, swappable from .env (fingerprint:JvmSourceAFISEngine = SourceAFIS through a JVM bridge).
      FINGERPRINT_ENGINE: ${FINGERPRINT_ENGINE:-}
      FINGERPRINT_DPI: ${FINGERPRINT_DPI:-500}
      FINGERPRINT_MATCH_THRESHOLD: ${FINGERPRINT_MATCH_THRESHOLD:-40}
      FINGERPRINT_MIN_MINUTIAE: ${FINGERPRINT_MIN_MINUTIAE:-12}
      FINGERPRINT_MIN_MINUTIAE_LATENT: ${FINGERPRINT_MIN_MINUTIAE_LATENT:-8}
      FINGERPRINT_MATCH_THREADS: ${FINGERPRINT_MATCH_THREADS:-4}
      # Voice biometrics stay OFF (the endpoints are not registered) until the evaluation has been run on real recordings.
      VOICEPRINT_ENABLED: ${VOICEPRINT_ENABLED:-false}
      VOICEPRINT_ENGINE: ${VOICEPRINT_ENGINE:-voiceprint:SpeechBrainEngine}
      VOICEPRINT_MIN_SPEECH_SECONDS: ${VOICEPRINT_MIN_SPEECH_SECONDS:-3}
      # Match TensorFlow/BLAS threads to the CPU quota; the host reports 12 cores, so the default over-subscribes and throttles ~4x.
      OMP_NUM_THREADS: "4"
      TF_NUM_INTRAOP_THREADS: "4"
      TF_NUM_INTEROP_THREADS: "1"
      OPENBLAS_NUM_THREADS: "4"
      MFA_REQUIRED_ROLES: ${MFA_REQUIRED_ROLES:-}
      # nginx serves the UI and the API from one origin; 5173 is the Vite dev server (npm run dev).
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost,http://localhost:5173}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-https://localhost}
      ARGUS_ENV: ${ARGUS_ENV:-development}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
    volumes:
      - ./uploads:/app/uploads
      - vault_secrets:/vault/secrets:ro
    # No host port: reachable only through nginx (TLS) on the compose network.
    expose:
      - "8000"
    depends_on:
      vault-agent:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "4"
          # Whisper "small" adds roughly 1 GB per API worker on top of the face models.
          memory: 5g
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 30s

  worker:
    build: .
    command: python worker.py
    restart: unless-stopped
    environment:
      MINIO_ENDPOINT: minio:9000
      REDIS_HOST: redis
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_USER: elastic
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-argus_db}
      SECRETS_DIR: /vault/secrets
      ARGUS_ENV: ${ARGUS_ENV:-development}
    volumes:
      - vault_secrets:/vault/secrets:ro
    depends_on:
      vault-agent:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1500m

  # ------------------------------------------------------------------ secrets
  vault:
    image: hashicorp/vault:1.15
    restart: unless-stopped
    # The image entrypoint adds -config=/vault/config itself; passing -config again would start a second listener.
    command: server
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - ./vault/vault.hcl:/vault/config/vault.hcl:ro
      - vault_data:/vault/file
    # Internal only: no host port.
    expose:
      - "8200"

  # One-shot: initialise on first run, unseal on every run, hand the agent its AppRole credentials.
  vault-init:
    image: hashicorp/vault:1.15
    entrypoint: ["/bin/sh", "/vault/init.sh"]
    restart: "no"
    environment:
      VAULT_ADDR: http://vault:8200
      ARGUS_ENV: ${ARGUS_ENV:-development}
      VAULT_UNSEAL_KEY: ${VAULT_UNSEAL_KEY:-}
      # First run only: existing values are migrated into Vault, anything left empty is generated.
      JWT_SECRET: ${JWT_SECRET:-}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      VICTIM_HASH_PEPPER: ${VICTIM_HASH_PEPPER:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
    volumes:
      - ./vault/init.sh:/vault/init.sh:ro
      - vault_auth:/vault/auth
      - vault_init:/vault/init
    depends_on:
      - vault

  # Sidecar: authenticates to Vault (AppRole) and keeps /vault/secrets/* rendered on a tmpfs volume.
  vault-agent:
    image: hashicorp/vault:1.15
    restart: unless-stopped
    command: agent -config=/vault/agent/agent.hcl
    volumes:
      - ./vault/agent.hcl:/vault/agent/agent.hcl:ro
      - vault_auth:/vault/auth:ro
      - vault_secrets:/vault/secrets
    depends_on:
      vault-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "for f in jwt_secret mfa_encryption_key victim_hash_pepper postgres_password neo4j_password redis_password elasticsearch_password minio_access_key minio_secret_key; do test -s /vault/secrets/$$f || exit 1; done"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  # ------------------------------------------------------------------ datastores (credentials from /vault/secrets)
  postgres:
    # postgres:16 + the PostGIS package, on the same Debian base as the stock image (see postgres/Dockerfile: the
    # postgis/postgis images use an older glibc, which misorders text indexes in a database created by postgres:16).
    build: ./postgres
    image: argus-postgres:16-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD_FILE: /vault/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-argus_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - vault_secrets:/vault/secrets:ro
    # No host port: reachable only on the internal compose network
    expose:
      - "5432"
    depends_on:
      vault-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-argus_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m

  neo4j:
    image: neo4j:latest
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - export NEO4J_AUTH="${NEO4J_USER:-neo4j}/$$(cat /vault/secrets/neo4j_password)"; exec tini -g -- /startup/docker-entrypoint.sh neo4j
    volumes:
      - neo4j_data:/data
      - vault_secrets:/vault/secrets:ro
    # Internal only. The browser on 7474 is not published (see docker-compose.debug.yml for local debugging).
    expose:
      - "7474"
      - "7687"
    depends_on:
      vault-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 16
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    restart: unless-stopped
    # ELASTIC_PASSWORD_FILE would demand mode 0400/0600, which the (uid 1000) ES user could not read on a file owned by the
    # Vault agent, so the entrypoint reads the secret itself.
    entrypoint:
      - /bin/sh
      - -c
      - export ELASTIC_PASSWORD="$$(cat /vault/secrets/elasticsearch_password)"; exec /bin/tini -- /usr/local/bin/docker-entrypoint.sh eswrapper
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - vault_secrets:/vault/secrets:ro
    # No host port: ES is reachable only on the internal compose network
    expose:
      - "9200"
    depends_on:
      vault-agent:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fs -u "elastic:$$(cat /vault/secrets/elasticsearch_password)" http://localhost:9200/_cluster/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1500m

  minio:
    image: minio/minio
    entrypoint:
      - /bin/sh
      - -c
      - export MINIO_ROOT_USER="$$(cat /vault/secrets/minio_access_key)" MINIO_ROOT_PASSWORD="$$(cat /vault/secrets/minio_secret_key)"; exec minio server /data --console-address ":9001"
    restart: unless-stopped
    volumes:
      - minio_data:/data
      - vault_secrets:/vault/secrets:ro
    # The console (9001) is not published (see docker-compose.debug.yml for local debugging).
    expose:
      - "9000"
      - "9001"
    depends_on:
      vault-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$(cat /vault/secrets/redis_password)" --save 60 1 --loglevel warning
    volumes:
      - vault_secrets:/vault/secrets:ro
    expose:
      - "6379"
    # No host port — Redis is internal only
    depends_on:
      vault-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /vault/secrets/redis_password)\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

secrets:
  # Optional HuggingFace read token for the gated IndicNER model (build time only). Unset = empty file = skip the download.
  hf_token:
    file: ${HF_TOKEN_FILE:-/dev/null}

volumes:
  postgres_data:
  neo4j_data:
  es_data:
  minio_data:
  vault_data:
  vault_auth:
  vault_init:      # development only: holds the unseal key so restarts need no manual step (never written in production)
  vault_secrets:   # rendered secrets; tmpfs, so they never touch disk
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=4m,mode=0755,uid=100,gid=1000   # uid 100 = the vault user inside hashicorp/vault (the agent writes here)
